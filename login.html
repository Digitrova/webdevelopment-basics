<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create your Web Academy student account or sign in to continue learning."><title>Student Login — Web Academy</title><link rel="stylesheet" href="css/lms.css"><script src="js/lms-common.js"></script><script src="js/auth.js" defer></script></head><body><header class="lms-top lms-shell"><a class="lms-brand" href="academy.html">WEB<span>ACADEMY</span></a><nav class="lms-nav"><a href="academy.html">Academy</a><a href="index.html">Home</a></nav></header><main class="lms-shell"><section class="lms-card lms-form"><div class="lms-pill">STUDENT ACCESS</div><h1 id="formTitle">Welcome back.</h1><p class="lms-muted" id="formIntro">Sign in to continue your learning journey and continue on this device.</p><form id="authForm"><div class="lms-field" id="nameField" hidden><label for="fullName">Full name</label><input id="fullName" autocomplete="name" placeholder="Your name"></div><div class="lms-field"><label for="email">Email address</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></div><div class="lms-field"><label for="password">Password</label><input id="password" type="password" required minlength="8" autocomplete="current-password" placeholder="At least 8 characters"></div><button class="lms-btn" id="submitBtn" type="submit">Sign in</button></form><p class="lms-message" id="message" role="status"></p><p><a href="#" class="lms-link" id="forgotLink">Forgot password?</a></p><p class="lms-muted"><span id="switchText">New to Web Academy?</span> <a href="#" class="lms-link" id="switchMode">Create an account</a></p><p class="lms-muted" style="font-size:12px">Demo mode: accounts and progress stay in this browser only. They do not sync to other devices.</p></section></main></body></html>
